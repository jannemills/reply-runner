name: Bio chat

on:
  repository_dispatch:
    types: [bio-chat]

permissions:
  contents: read

jobs:
  reply:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      # Cached install: restoring the cache is faster than installing on every message.
      - name: Restore Claude Code
        id: claude-cache
        uses: actions/cache@v4
        with:
          path: ~/.claude-cli
          key: claude-code-2.1.316-${{ runner.os }}
      - name: Install Claude Code
        if: steps.claude-cache.outputs.cache-hit != 'true'
        run: npm install -g --prefix ~/.claude-cli @anthropic-ai/claude-code@2.1.316
      - name: Add Claude Code to PATH
        run: echo "$HOME/.claude-cli/bin" >> "$GITHUB_PATH"
      - name: Run the job
        env:
          JOB_ID: ${{ github.event.client_payload.job }}
          JOB_DATA: ${{ github.event.client_payload.data }}
          PAYLOAD_KEY: ${{ secrets.BIO_PAYLOAD_KEY }}
          WORKER_URL: ${{ secrets.BIO_WORKER_URL }}
          JOB_SECRET: ${{ secrets.BIO_JOB_SECRET }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BIO_MODEL: ${{ vars.BIO_MODEL }}
        run: node bio.mjs
