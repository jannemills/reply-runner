name: Bio chat

on:
  repository_dispatch:
    types: [bio-chat]

permissions:
  contents: read

jobs:
  reply:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.316
      - name: Run the job
        env:
          JOB_ID: ${{ github.event.client_payload.job }}
          WORKER_URL: ${{ secrets.BIO_WORKER_URL }}
          JOB_SECRET: ${{ secrets.BIO_JOB_SECRET }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BIO_MODEL: ${{ vars.BIO_MODEL }}
        run: node bio.mjs
