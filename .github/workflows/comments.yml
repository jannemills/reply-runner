name: Comments

on:
  repository_dispatch:
    types: [comments]

permissions:
  contents: read

jobs:
  comments:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.316
      - name: Run the job
        env:
          JOB_ID: ${{ github.event.client_payload.job }}
          IG_WORKER_URL: ${{ secrets.IG_WORKER_URL }}
          IG_JOB_SECRET: ${{ secrets.IG_JOB_SECRET }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node comments.mjs
